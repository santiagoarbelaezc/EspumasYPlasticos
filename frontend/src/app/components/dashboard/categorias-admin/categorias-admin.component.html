<div class="categorias-container">
  <!-- Panel izquierdo: Formulario -->
  <div class="formulario">
    <!-- Botón Volver -->
    <button class="btn-volver" type="button" (click)="volverAlDashboard()">
      <fa-icon [icon]="faArrowLeft"></fa-icon> Volver al Dashboard
    </button>

    <h3>{{ editando ? 'Editar Categoría' : 'Nueva Categoría' }}</h3>

    <form [formGroup]="formCategoria" (ngSubmit)="guardarCategoria()">
      <!-- Campo nombre -->
      <div class="form-group">
        <label for="nombre">Nombre de la Categoría:</label>
        <input 
          id="nombre" 
          type="text" 
          formControlName="nombre"
          placeholder="Ej: Espumas" />
      </div>

      <!-- Campo icono -->
      <div class="form-group file-input-wrapper">
        <label for="icono">Ícono de la Categoría:</label>
        <input 
          id="icono" 
          type="file"
          accept="image/*"
          (change)="onFileChange($event)" />
        <div class="preview-container" *ngIf="previewUrl">
          <img [src]="previewUrl" alt="Vista previa del ícono" class="preview-img" />
        </div>
      </div>

      <!-- Botones -->
      <button
        type="submit"
        [ngClass]="editando ? 'btn-actualizar' : 'btn-crear'"
        [disabled]="formCategoria.invalid">
        <fa-icon [icon]="editando ? faCheck : faPlus"></fa-icon>
        {{ editando ? 'Actualizar' : 'Crear' }}
      </button>

      <button
        type="button"
        class="btn-cancelar"
        *ngIf="editando"
        (click)="cancelarEdicion()">
        <fa-icon [icon]="faTimes"></fa-icon> Cancelar
      </button>
    </form>
  </div>

  <!-- Panel derecho: Tabla -->
  <div class="tabla">
    <div class="header-tabla">
      <h3>Categorías Registradas</h3>
      <div class="search-container-with-icon">
        <fa-icon [icon]="faSearch" class="search-icon"></fa-icon>
        <input 
          type="text" 
          placeholder="Buscar categoría..." 
          (input)="onSearchChange($event)" />
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Ícono</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of paginatedCategorias" (click)="seleccionar(cat)">
          <td class="cell-nombre">{{ cat.nombre }}</td>
          <td>
            <img 
              *ngIf="cat.icono_url" 
              [src]="cat.icono_url" 
              [alt]="'Ícono de ' + cat.nombre"
              class="icono-mini" />
          </td>
          <td>
            <button 
              type="button" 
              class="btn-delete"
              (click)="eliminar(cat.id); $event.stopPropagation()">
              <fa-icon [icon]="faTrash"></fa-icon> Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- 📄 Paginación -->
    <div class="pagination-container">
      <div class="pagination-info">
        Mostrando {{ (currentPage - 1) * pageSize + 1 }} - {{ Math.min(currentPage * pageSize, totalCategorias) }} de {{ totalCategorias }} categorías
      </div>

      <div class="pagination-controls">
        <button 
          (click)="irAPaginaAnterior()" 
          [disabled]="currentPage === 1"
          class="btn-pagination btn-prev"
          title="Página anterior">
          <fa-icon [icon]="faArrowLeft"></fa-icon> Anterior
        </button>

        <div class="page-numbers">
          <button 
            *ngFor="let page of [].constructor(totalPages); let i = index"
            (click)="cambiarPagina(i + 1)"
            [class.active]="currentPage === i + 1"
            class="btn-page-number">
            {{ i + 1 }}
          </button>
        </div>

        <button 
          (click)="irAPaginaSiguiente()" 
          [disabled]="currentPage === totalPages"
          class="btn-pagination btn-next"
          title="Página siguiente">
          Siguiente →
        </button>
      </div>
    </div>
  </div>
</div>
