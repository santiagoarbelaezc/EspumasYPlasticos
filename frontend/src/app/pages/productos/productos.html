<div class="productos-layout">
  <app-menu-categorias #menuCategorias (subcategoriaSeleccionada)="closeMenu()"></app-menu-categorias>
  <app-productos-list></app-productos-list>
</div>

<!-- Flecha desplegable para móvil -->
<button class="menu-toggle-categorias" (click)="toggleMenu()">

</button>

<!-- Overlay para cerrar menú tocando fuera -->
<div class="menu-overlay" 
     [class.visible]="menuVisible" 
     (click)="closeMenu()"></div>
